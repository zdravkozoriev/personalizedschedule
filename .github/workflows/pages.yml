name: Публикуване в GitHub Pages

on:
  push:
    branches: [main, 'claude/sweet-hypatia-szyr3p']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Подготви файловете
        run: |
          mkdir _site
          cp -r index.html styles.css app.js voice.js sw.js manifest.webmanifest icons _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
